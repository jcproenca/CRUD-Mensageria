# ============================================================
# API 2 – Consumer RabbitMQ
# ============================================================
spring.application.name=api2-consumer
server.port=8081

# ------------------------------------------------------------
# RabbitMQ – mesmas credenciais/host que a API 1
# ------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ------------------------------------------------------------
# Logging – formato legível com timestamp visível no terminal
# ------------------------------------------------------------
logging.level.com.example.api2consumer=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
